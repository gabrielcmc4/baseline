<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saibro — análise de golpes de tênis</title>
<meta name="description" content="Tennis shot analysis from a single video, running entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B1D15'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23CBE33A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="mark" href="./" aria-label="Saibro"><span class="ball" aria-hidden="true"></span>Saibro</a>
  <span class="tag" data-i18n="tagline"></span>
  <div class="lang" role="group" aria-label="Idioma / Language"><button data-lang="pt">PT</button><button data-lang="en">EN</button></div>
</header>

<section class="hero" id="hero">
  <div class="hero-in">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroSub"></p>
  </div>
  <svg class="arc" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <line x1="60" y1="230" x2="1140" y2="230" class="g"/><line x1="600" y1="230" x2="600" y2="188" class="n"/>
    <line x1="110" y1="230" x2="110" y2="224" class="g"/><line x1="1090" y1="230" x2="1090" y2="224" class="g"/><line x1="850" y1="230" x2="850" y2="224" class="g"/><line x1="350" y1="230" x2="350" y2="224" class="g"/>
    <path d="M150 170 Q 560 -40 930 230" class="p2"/><path d="M150 170 Q 600 20 1010 230" class="p1"/>
    <circle cx="930" cy="226" r="7" class="b"/>
  </svg>
</section>

<nav class="steps" aria-label="steps"><ol>
  <li data-step="1"><span data-i18n="step1"></span></li><li data-step="2"><span data-i18n="step2"></span></li><li data-step="3"><span data-i18n="step3"></span></li><li data-step="4"><span data-i18n="step4"></span></li>
</ol></nav>

<main>
<section id="s1" class="panel">
  <div class="drop" id="drop">
    <button class="btn primary" id="pick" data-i18n="chooseVideo"></button>
    <span class="hint" data-i18n="dropHint"></span>
    <input type="file" id="file" accept="video/*" hidden>
  </div>
  <p class="err" id="err1" hidden></p>
  <h2 data-i18n="sessionType"></h2>
  <div class="modes" role="radiogroup">
    <label><input type="radio" name="mode" value="coach" checked><span><b data-i18n="coach"></b><i data-i18n="coachD"></i></span></label>
    <label><input type="radio" name="mode" value="serve"><span><b data-i18n="serve"></b><i data-i18n="serveD"></i></span></label>
    <label><input type="radio" name="mode" value="match"><span><b data-i18n="match"></b><i data-i18n="matchD"></i></span></label>
  </div>
  <details class="tips"><summary data-i18n="tipsTitle"></summary><ul data-i18n-list="tips"></ul></details>
</section>

<section id="s2" class="panel" hidden>
  <h2 data-i18n="courtTitle"></h2>
  <p class="help" data-i18n="courtHelp"></p>
  <div class="court-ui">
    <div class="stage"><canvas id="frame"></canvas></div>
    <aside>
      <svg id="mini" viewBox="-7 -1.5 14 27" aria-hidden="true"></svg>
      <p class="active-line" id="activeName"></p>
      <div class="row"><button class="btn" id="skip" data-i18n="skip"></button><button class="btn" id="redo" data-i18n="redo"></button></div>
      <label class="slider"><span data-i18n="frameAt"></span><input type="range" id="seek" min="0" max="1000" value="80"></label>
      <button class="btn link" id="clear" data-i18n="clearAll"></button>
    </aside>
  </div>
  <p class="msg" id="calMsg"></p>
  <div class="row end"><button class="btn" id="back2" data-i18n="back"></button><button class="btn" id="check" data-i18n="check"></button><button class="btn primary" id="go" data-i18n="analyze" disabled></button></div>
</section>

<section id="s3" class="panel" hidden>
  <h2 id="stage"></h2>
  <div class="bar"><i id="bar"></i></div>
  <p class="help" id="eta"></p>
  <canvas id="preview"></canvas>
  <p class="help" data-i18n="keepOpen"></p>
  <button class="btn" id="cancel" data-i18n="cancel"></button>
</section>

<section id="s4" hidden>
  <div class="stats" id="stats"></div>
  <div class="views">
    <figure class="panel"><figcaption data-i18n="topView"></figcaption><div id="top"></div><div class="legend" id="legend"></div></figure>
    <div class="col">
      <figure class="panel"><figcaption data-i18n="sideView"></figcaption><div id="side"></div></figure>
      <div class="panel sel" id="sel"></div>
    </div>
  </div>
  <div class="panel"><h2 data-i18n="shotList"></h2><div class="tablewrap"><table id="tbl"></table></div></div>
  <div class="panel trust"><h2 data-i18n="accTitle"></h2><p id="acc"></p><p id="accSpin"></p></div>
  <div class="row end noprint"><button class="btn" id="csv" data-i18n="csv"></button><button class="btn" id="print" data-i18n="print"></button><button class="btn primary" id="again" data-i18n="another"></button></div>
</section>
</main>
<footer data-i18n="footer"></footer>
<script src="vendor/mp4box.all.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
